services:
  db:
    image: pgvector/pgvector:pg16
    env_file: .env
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  api:
    build: .
    env_file: .env
    environment:
      # Wins over env_file: files go to the persistent volume, writable by the non-root user.
      RESUME_STORAGE_DIR: /data/resumes
    volumes:
      - resume_files:/data/resumes
    extra_hosts:
      # Docker Desktop defines this name; on Linux it must be added so LLM_BASE_URL /
      # EMBEDDING_BASE_URL can point to a model server (Ollama, ...) running on the host.
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

volumes:
  pgdata:
  resume_files:
