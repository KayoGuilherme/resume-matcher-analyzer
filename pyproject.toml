[project]
name = "ats-resume-analyzer"
version = "0.1.0"
description = "AI agent that reports what a resume is missing to pass ATS/AI first-step screening."
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic-settings",
    "sqlalchemy[asyncio]",
    "asyncpg",
    "alembic",
    "pdfplumber>=0.11.10",
    "python-docx>=1.2.0",
    "python-multipart>=0.0.34",
    "anthropic>=2.12.0",
    "openai>=3.57.0",
    "pgvector>=0.5.1",
]

[project.optional-dependencies]
local-embeddings = [
    "sentence-transformers>=6.3.0",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "httpx",
    "ruff",
    "mypy",
    "pytest-cov>=7.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "."]
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = ["-m", "not integration and not real_provider"]
markers = [
    "integration: needs a real PostgreSQL (DATABASE_URL); excluded from the default run",
    "real_provider: calls the LLM/embeddings provider configured in the environment; excluded from the default run",
]

[tool.coverage.run]
branch = true
source_pkgs = ["app"]

[tool.coverage.report]
fail_under = 80
show_missing = true

[[tool.mypy.overrides]]
module = ["sentence_transformers", "sentence_transformers.*"]
ignore_missing_imports = true
